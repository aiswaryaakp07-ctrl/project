<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Classroom Attention System</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <header>
    <h1>AI Classroom Attention System</h1>
    <p>Real-time distraction detection using AI vision model</p>
  </header>

  <div class="buttons">
    <button onclick="init()">Start Camera</button>
    <button onclick="testModelURL()">Test Model</button>
    <button onclick="resetDemo()">Reset</button>
  </div>

  <div id="status">Click Start Camera to begin</div>

  <div class="grid">

    <div class="camera">
      <div id="webcam-container"></div>
    </div>

    <div class="panel">
      <h2>Live Distraction Level</h2>

      <!-- FIXED BOXES (always present) -->
      <div id="lowBox" class="label-box low">
        No Distraction 🟢 <span id="lowVal">0%</span>
      </div>

      <div id="mediumBox" class="label-box medium">
        Medium Distraction 🟠 <span id="mediumVal">0%</span>
      </div>

      <div id="highBox" class="label-box high">
        High Distraction 🔴 <span id="highVal">0%</span>
      </div>

    </div>

  </div>

  <footer>
    Created by <b>Aiswarya K P</b> • AI Project Demo
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script src="script.js"></script>

</body>
</html>
